## nespreso_api  – updated for current branch
##
## This file runs the service directly with mod_wsgi, using the
## same conda env and PYTHONPATH you specify in:
##   PYTHONPATH=nespreso_api:nespreso_api/eoas-pyutils \
##   gunicorn … 'nespreso_api.wsgi:app'

# 1) Python runtime & import-paths
WSGIDaemonProcess nespreso_api \
    user=apache group=apache \
    python-home=/unity/g2/jmiranda/.conda/envs/nespreso \
    python-path=/unity/g2/jmiranda/nespreso_api:/unity/g2/jmiranda/nespreso_api/eoas-pyutils \
    processes=2 threads=15

# 2) Tell Apache which WSGI entrypoint to load
WSGIScriptAlias /nespreso_api \
    /unity/g2/jmiranda/nespreso_api/nespreso_api/wsgi.py \
    process-group=nespreso_api \
    application-group=%{GLOBAL}

# 3) Allow the app code to be served
<Directory "/unity/g2/jmiranda/nespreso_api/nespreso_api">
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>


